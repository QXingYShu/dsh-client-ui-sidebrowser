# dsh-client-ui-sidebrowser bundle patch: inserts the dual-face plugin row into
# the web profile roster.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the Host process (browser driver, control routes and the browser_* agent
# tools), while the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the Web
# GUI, where it contributes the right-sidebar browser tab and the text-selection
# mini-popup.
#
# Install with:
#   dsh plugin --profile <name> add link:~/code/dsh-client-ui-sidebrowser
- insert:
    - id: ui-sidebrowser
      name: '@dsh-external/dsh-client-ui-sidebrowser'